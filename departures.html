<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Découvrez tous les départs fixes de Lok Treks Nepal. Rejoignez un groupe pour trekker vers l'Everest, l'Annapurna ou d'autres régions mythiques à des dates précises avec notre agence francophone.">
    <link rel="canonical" href="https://www.loktreksnepal.com/departures" />
    <title>Départs Fixes & Groupes | Lok Treks Nepal</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .hero {
            position: relative;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('assets/images/heroes/hero3.jpg') center/cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding-top: 80px; /* Offset header */
        }
        
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s forwards ease-out;
        }

        .departures-section {
            padding: 80px 0;
            background: #f8f9fa;
        }

        .departures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .departure-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s forwards ease-out;
        }

        .departure-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-image-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .departure-card:hover .card-image {
            transform: scale(1.05);
        }

        .category-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary-color);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .date-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--secondary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 12px 0 0 0;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: -4px -4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-item i {
            color: var(--secondary-color);
        }

        .btn-view {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            text-align: center;
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .btn-view:hover {
            background: var(--primary-color);
            color: white;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .loading-spinner {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Container -->
    <div id="header-container"></div>

    <section class="hero">
        <div class="container">
            <h1 class="hero-title" data-i18n="departs_fixes_title">Départs Fixes & Groupes</h1>
            <p style="font-size:1.2rem; max-width:600px; margin:0 auto; opacity:0; animation: fadeUp 1s 0.3s forwards ease-out;" data-i18n="departs_fixes_subtitle">Rejoignez un groupe existant et vivez l'aventure himalayenne aux meilleures dates sélectionnées par nos experts.</p>
        </div>
    </section>

    <section class="departures-section">
        <div class="container">
            <div class="departures-grid" id="departures-container">
                
                <!-- Loading State -->
                <div class="loading-state" id="loading-state">
                    <i class="fas fa-circle-notch fa-spin loading-spinner"></i>
                    <h3 data-i18n="chargement_departs">Chargement des départs actuels...</h3>
                </div>

                <!-- Active departures will be injected here via JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("header-container", { rootPath: "./" });
            renderFooter("footer-container", { rootPath: "./" });
            
            // Wait a tiny bit for translation scripts to initialize if needed
            setTimeout(loadDepartures, 100);
        });

        function loadDepartures() {
            const container = document.getElementById('departures-container');
            
            fetch('./api/get_departures.php')
                .then(response => {
                    if (!response.ok) throw new Error("Erreur réseau");
                    return response.json();
                })
                .then(result => {
                    container.innerHTML = ''; // Clear loading
                    
                    if (result.status === 'success' && result.data.length > 0) {
                        result.data.forEach((item, index) => {
                            // Convert standard duration format (assuming it's in French) for generic output
                            const durationText = item.duration;
                            
                            const card = document.createElement('div');
                            card.className = 'departure-card';
                            card.style.animationDelay = `${index * 0.1}s`;
                            
                            card.innerHTML = `
                                <div class="card-image-wrapper">
                                    <span class="category-badge">${item.category}</span>
                                    <img src="${item.image_url}" alt="${item.trek_name}" class="card-image" onerror="this.src='assets/images/placeholder.jpg'">
                                    <div class="date-badge">
                                        <i class="far fa-calendar-alt"></i> ${item.departure_date}
                                    </div>
                                </div>
                                <div class="card-content">
                                    <h3 class="card-title">${item.trek_name}</h3>
                                    <div class="card-meta">
                                        <div class="meta-item">
                                            <i class="far fa-clock"></i>
                                            <span>${durationText}</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="fas fa-map-marker-alt"></i>
                                            <span>Népal</span>
                                        </div>
                                    </div>
                                    <a href="${item.trek_url}" class="btn-view" data-i18n="voir_programme">Voir le programme</a>
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        // Empty State
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="far fa-calendar-times" style="font-size: 3rem; color: #ccc; margin-bottom: 20px;"></i>
                                <h3 data-i18n="aucun_depart_titre">Aucun départ fixe prévu pour le moment.</h3>
                                <p style="color: #666; margin-top: 10px;" data-i18n="aucun_depart_desc">Mais nous pouvons organiser un trek privé à vos dates idéales !</p>
                                <a href="contact.html" class="btn-view" style="max-width: 250px; margin: 30px auto 0;" data-i18n="contactez_nous">Contactez-nous</a>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error("Erreur:", error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #e74c3c; margin-bottom: 20px;"></i>
                            <h3>Une erreur est survenue</h3>
                            <p style="color: #666; margin-top: 10px;">Impossible de charger les départs pour le moment. Veuillez réessayer plus tard.</p>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
