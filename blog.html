<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://www.loktreksnepal.com/blog" />
    <title>Blog | Lok Treks Nepal - Histoires de Trek & Aperçus</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/blog.css" />

  <body>

    <div id="google_translate_element" style="display: none"></div>

    <!-- Header -->
    <div id="header-container"></div>

    <main>
      <!-- Hero Section -->
      <section class="hero blog-hero">
        <div class="hero-bg">
          <img
            src="assets/images/Blog-1/blog-1.jpeg"
            alt="Histoires de Trek en Himalaya"
            class="hero-img"
          />
          <div class="hero-overlay"></div>
        </div>
        <div class="container hero-content">
          <h1 data-i18n="blog_hero_title">Histoires de Trek & Aperçus</h1>
          <p class="hero-subtitle" data-i18n="blog_hero_subtitle">
            Découvrez les histoires inédites, des conseils pratiques et des aperçus
            profonds des sentiers de l'Himalaya.
          </p>

          <div class="hero-breadcrumbs">
            <span><a href="../index.html" style="color: inherit" data-i18n="breadcrumb_home">Accueil</a></span> / <span><a href="../blog.html" style="color: inherit" data-i18n="breadcrumb_blog">Blog</a></span>
          </div>
        </div>
      </section>

      <section class="section blog-section">
        <div class="container">
          <div class="blog-header">
            <h2 class="section-title" data-i18n="blog_latest_stories_title">Dernières Histoires</h2>
            <p class="section-subtitle" data-i18n="blog_latest_stories_subtitle">
              Des expériences réelles, des aperçus honnêtes et des conseils pratiques des
              sentiers.
            </p>
          </div>

          <!-- Blog Grid -->
          <div class="blog-grid" id="blogGrid">
            <!-- Blog cards will be loaded here by JavaScript -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script>
      renderHeader("header-container", { rootPath: "./" });
      renderFooter("footer-container", { rootPath: "./" });
    </script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/blog.js"></script>
    
    <!-- Google Translate Script -->
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
